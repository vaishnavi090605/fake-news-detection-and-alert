services:
  - type: web
    name: truthguard-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FAKE_NEWS_ADMIN_CODE
        value: letmein-admin
